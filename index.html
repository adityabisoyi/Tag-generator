<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymer Enterprises</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container" class="container">
        <div class="tag-selector">
            <button class="tag-type top-btns" onclick="readJson(1)">Tag 1</button>
            <button class="tag-type top-btns" onclick="readJson(2)">Tag 2</button>
            <button id="ResetButton" class="reset-tags top-btns" onclick="handleReset()">Reset</button>
        </div>
        <div id="MainBody" class="main-body">
            <div class="tag">
                <span class="material-symbols-outlined delete-icon icon" onclick="handleDelete(event)">
                    delete
                </span>
                <div class="tag-header">
                    <div class="reference-no">
                        <p>Ref P.O. No. :</p>
                        <input type="text">
                        <!-- <p>Date</p>
                        <input type="text"> -->
                    </div>
                    <h3>POLYMER ENTERPRISES (NASIK)</h3>
                    <h4>(An ISO 9001-2015 Company)</h4>
                    <h4>ACCEPTED</h4>
                </div>
                <div class="tag-content">
                    <div id="FullWidth" class="full-width"></div>
                    <div id="SplitText" class="split-text"></div>
                    <div id="StampSplit" class="stamp-split">
                        <div>
                            <div id="StampFields" class="stamp-fields"></div>
                            <div id="StampFooter" class="stamp-footer"></div>
                        </div>
                        <div class="stamp-box">
                            <p>Insp <br> Stamp</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.5.3/jspdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
